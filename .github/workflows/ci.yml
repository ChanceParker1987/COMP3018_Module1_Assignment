name: Node.js CI

on:
    push:
        branches: [dev]
    pull_request:
        branches: [main]

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6
            - name: Use Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "20.x"
            - run: npm install
            - run: npm test